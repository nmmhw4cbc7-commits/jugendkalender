<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f4bff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Geburtstage">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Jugendkalender</title>
<style>
:root{--bg:#fffdf6;--ink:#1a1a3d;--mut:#6b6b8d;--card:#fff;--line:#e6e2d3;--acc:#2f4bff;--sun:#ffd23f;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#12122b;--ink:#f3f1ff;--mut:#a3a3c7;--card:#1c1c3b;--line:#2d2d55;--acc:#7b8cff;--on:#10102a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.4}
main{max-width:560px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
h1{font-size:1.5rem;font-weight:800;margin:0;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1 .i{width:28px;height:28px;color:var(--acc)}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 14px;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.pri{background:var(--acc);color:var(--on)}
.today{background:var(--sun);color:#1a1a3d;border-radius:22px;padding:20px;margin-bottom:22px}
.today h2{margin:0 0 10px;font-size:1rem;font-weight:600}
.t-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
.t-item+.t-item{border-top:2px solid rgba(26,26,61,.15)}
.t-age{font-size:3.4rem;font-weight:800;line-height:1;letter-spacing:-.04em}
.t-name{font-weight:800;font-size:1.25rem}
.today .pri{background:#1a1a3d;color:#fff;white-space:nowrap}
.t-empty{font-size:1.1rem;font-weight:600}
.sw{position:relative;margin-bottom:12px}
.sw .i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mut)}
input[type=search]{width:100%;font:inherit;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
input[type=search]{padding-left:44px}
h3{font-size:.95rem;margin:14px 0 6px;color:var(--mut);font-weight:600}
.row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.dt{min-width:52px;text-align:center;font-weight:800;line-height:1.1}
.dt small{display:block;font-weight:600;color:var(--mut);font-size:.72rem}
.who{flex:1;min-width:0}
.who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who span{color:var(--mut);font-size:.85rem}
.row .ghost{padding:9px 11px}
dialog{border:0;border-radius:20px;padding:20px;width:min(92vw,480px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(10,10,30,.55)}
dialog h2{margin:0 0 10px;font-size:1.2rem}
textarea{width:100%;font:inherit;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.hint{color:var(--mut);font-size:.85rem;margin:8px 0}
label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 6px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="i-cake" viewBox="0 0 24 24"><path d="M4 21h16M5 21v-8h14v8M3 13h18M12 13V9"/><path d="M12 3c1.2 1.3 1.2 2.7 0 3.6-1.2-.9-1.2-2.3 0-3.6z"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
<symbol id="i-gift" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4"/><path d="M12 8v13M5 12v9h14v-9M7.5 8a2.5 2.5 0 1 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 1 1 0 5"/></symbol>
<symbol id="i-send" viewBox="0 0 24 24"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></symbol>
<symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></symbol>
<symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
<symbol id="i-sheet" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/></symbol>
<symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
</svg>

<main>
<header><h1><svg class="i"><use href="#i-cake"/></svg>Jugendkalender</h1>
<div><button class="ghost" id="ref" aria-label="Geburtstage aktualisieren"><svg class="i"><use href="#i-refresh"/></svg>Aktualisieren</button></div></header>
<section class="today" id="today" aria-live="polite"></section>
<div class="sw"><svg class="i"><use href="#i-search"/></svg><input type="search" id="q" placeholder="Name suchen" aria-label="Name suchen" autocomplete="off"></div>
<div id="list"></div>
</main>

<dialog id="dGrat">
<h2 id="gTitle">Gratulieren</h2>
<textarea id="gMsg" rows="4" aria-label="Nachricht"></textarea>
<p class="hint" id="gHint"></p>
<div class="acts">
<button class="pri" id="gTg"><svg class="i"><use href="#i-send"/></svg>Telegram</button>
<button class="pri" id="gImg"><svg class="i"><use href="#i-image"/></svg>Bild teilen</button>
<button class="ghost" id="gCopy"><svg class="i"><use href="#i-copy"/></svg>Kopieren</button>
<button class="ghost" id="gClose"><svg class="i"><use href="#i-x"/></svg>Schließen</button>
</div>
</dialog>

<div class="toast" id="toast" role="status"></div>

<script>
/* ============================================================
   HIER DEINE SUPABASE-DATEN EINTRAGEN
   Supabase: Project Settings > API
   - Project URL      -> SUPABASE_URL
   - anon / publishable Key -> SUPABASE_KEY  (NICHT den service_role Key!)
   ============================================================ */
const SUPABASE_URL = "";
const SUPABASE_KEY = "";

const $=s=>document.querySelector(s);
const ic=n=>`<svg class="i" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const DEMO=[["Mia Berger","2008-10-06","@mia_b"],["Jonas Weber","2009-10-09",""],["Lea Schmitt","2007-10-21","@leas"],["Ben Fischer","2010-11-02",""],["Emma Wolf","2008-01-15",""],["Paul Koch","2009-03-30",""]];
const LS=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
let data=[];
function toP(r){const d=pDate(r[1]);return d?{n:(r[0]||'').trim(),y:d.y,m:d.m,d:d.d,tg:(r[2]||'').trim()}:null}
function pDate(s){s=(s||'').trim();let a;
 if(a=s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})$/)){let y=+a[3];if(y<100)y+=y>30?1900:2000;return{d:+a[1],m:+a[2],y}}
 if(a=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return{y:+a[1],m:+a[2],d:+a[3]};
 if(a=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/))return{m:+a[1],d:+a[2],y:+a[3]};return null}
try{data=JSON.parse(LS('jk_data')||'null')}catch(e){}
if(!data)data=SUPABASE_URL?[]:DEMO.map(toP);
function save(){LS('jk_data',JSON.stringify(data))}
function leap(y){return y%4==0&&(y%100!=0||y%400==0)}
function next(p){const t=new Date();t.setHours(0,0,0,0);let y=t.getFullYear();
 const mk=y=>new Date(y,p.m-1,(p.m==2&&p.d==29&&!leap(y))?28:p.d);
 let dt=mk(y);if(dt<t){y++;dt=mk(y)}
 return{date:dt,days:Math.round((dt-t)/864e5),age:y-p.y}}
const MON=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(){
 const all=data.map(p=>({p,...next(p)})).sort((a,b)=>a.days-b.days);
 const td=all.filter(x=>x.days==0);
 const T=$('#today');
 if(!all.length){T.innerHTML='<div class="t-empty">Noch keine Daten. Mit dem Internet verbinden und oben auf Aktualisieren tippen.</div>'}
 else if(td.length){T.innerHTML='<h2>Heute Geburtstag</h2>'+td.map(x=>`<div class="t-item"><div><div class="t-name">${esc(x.p.n)}</div><div class="t-age">${x.age}</div></div><button class="pri" data-g="${data.indexOf(x.p)}">${ic('gift')}Gratulieren</button></div>`).join('')}
 else{const n=all[0];T.innerHTML=`<div class="t-empty">Heute hat niemand Geburtstag.<br>Als Nächstes: ${esc(n.p.n)} wird ${n.age}, ${n.days==1?'morgen':'in '+n.days+' Tagen'}.</div>`}
 const q=$('#q').value.trim().toLowerCase();
 let items,head;
 if(q){items=all.filter(x=>x.p.n.toLowerCase().includes(q)).sort((a,b)=>a.p.n.localeCompare(b.p.n,'de')).slice(0,60);head=items.length?'':'<p class="hint">Keine Treffer.</p>'}
 else{items=all.filter(x=>x.days>0&&x.days<=60).slice(0,20);head='<h3>Demnächst</h3>'}
 $('#list').innerHTML=head+items.map(x=>{
  const w=x.days==0?'heute':x.days==1?'morgen':`in ${x.days} Tagen`;
  return `<div class="row"><div class="dt">${x.date.getDate()}.<small>${MON[x.date.getMonth()]}</small></div><div class="who"><b>${esc(x.p.n)}</b><span>wird ${x.age} · ${w}</span></div><button class="ghost" data-g="${data.indexOf(x.p)}" aria-label="Gratulieren ${esc(x.p.n)}">${ic('gift')}</button></div>`}).join('')}
document.addEventListener('click',e=>{const b=e.target.closest('[data-g]');if(b)openG(+b.dataset.g)});
$('#q').addEventListener('input',render);

let cur=null;
function msg(p){const a=next(p).age;return `Alles Gute zum ${a}. Geburtstag, ${p.n.split(' ')[0]}! Feier schön und lass dich ordentlich feiern!`}
function openG(i){const p=data[i];if(!p)return;cur={p,age:next(p).age};
 $('#gTitle').textContent='Gratulieren: '+p.n;$('#gMsg').value=msg(p);
 $('#gHint').textContent=p.tg?'Telegram: '+p.tg:'Kein Telegram-Kontakt hinterlegt. Beim Senden wählst du den Chat selbst aus.';
 $('#dGrat').showModal()}
$('#gClose').onclick=()=>$('#dGrat').close();
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200)}
async function copy(t){try{await navigator.clipboard.writeText(t);return true}catch(e){return false}}
$('#gCopy').onclick=async()=>toast(await copy($('#gMsg').value)?'Text kopiert':'Kopieren nicht möglich');
$('#gTg').onclick=async()=>{const t=$('#gMsg').value,tg=cur.p.tg.replace(/\s/g,'');let url;
 if(/^@?[A-Za-z]\w{4,}$/.test(tg))url=`https://t.me/${tg.replace('@','')}?text=${encodeURIComponent(t)}`;
 else if(/^\+?\d{6,}$/.test(tg)){await copy(t);toast('Text kopiert, im Chat einfügen');url=`https://t.me/${tg.startsWith('+')?tg:'+'+tg}`}
 else url=`https://t.me/share/url?url=%20&text=${encodeURIComponent(t)}`;
 window.open(url,'_blank','noopener')};
$('#gImg').onclick=async()=>{const c=card(cur.p,cur.age);
 const blob=await new Promise(r=>c.toBlob(r,'image/png'));const file=new File([blob],'glueckwunsch.png',{type:'image/png'});
 try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],text:$('#gMsg').value});return}}catch(e){if(e.name==='AbortError')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='glueckwunsch.png';a.click();toast('Bild gespeichert')};
function card(p,age){const c=document.createElement('canvas');c.width=c.height=1080;const x=c.getContext('2d');
 x.fillStyle='#2f4bff';x.fillRect(0,0,1080,1080);
 let s=p.n.length*7+age;const rnd=()=>(s=(s*9301+49297)%233280)/233280;
 const cols=['#ffd23f','#ffffff','#ff6b9d','#5ee6c1'];
 for(let i=0;i<70;i++){x.fillStyle=cols[i%4];x.globalAlpha=.85;x.beginPath();x.arc(rnd()*1080,rnd()*1080,6+rnd()*18,0,7);x.fill()}
 x.globalAlpha=1;x.fillStyle='#ffd23f';x.beginPath();x.arc(540,470,300,0,7);x.fill();
 x.textAlign='center';x.fillStyle='#1a1a3d';x.font='800 330px system-ui,sans-serif';x.fillText(age,540,585);
 x.fillStyle='#fff';x.font='800 84px system-ui,sans-serif';x.fillText('Alles Gute zum Geburtstag!',540,870);
 let fs=100;x.font=`800 ${fs}px system-ui,sans-serif`;while(x.measureText(p.n).width>940&&fs>40){fs-=6;x.font=`800 ${fs}px system-ui,sans-serif`}
 x.fillStyle='#ffd23f';x.fillText(p.n,540,980);return c}

function parse(t){const L=t.split(/\r?\n/).filter(l=>l.trim());if(!L.length)return[];
 const dl=L[0].includes('\t')?'\t':L[0].includes(';')?';':',';
 const R=L.map(l=>l.split(dl).map(c=>c.trim().replace(/^"|"$/g,'')));
 let ni=0,di=1,ti=2;
 if(!R[0].some(c=>pDate(c))){const h=R.shift().map(c=>c.toLowerCase());
  const f=re=>h.findIndex(c=>re.test(c));
  if(f(/name/)>=0)ni=f(/name/);if(f(/geb|datum|date/)>=0)di=f(/geb|datum|date/);ti=f(/tele|tg|handy/)}
 return R.map(r=>toP([r[ni],r[di],ti>=0?r[ti]:''])).filter(p=>p&&p.n)}
const SB=SUPABASE_URL.replace(/\/$/,'');
async function loadDB(quiet){
 if(!SUPABASE_URL){if(!quiet)toast('Supabase ist im Code noch nicht eingetragen');return}
 try{let all=[],off=0;
  while(true){
   const r=await fetch(`${SB}/rest/v1/birthdays?select=name,birthdate,telegram&order=name&limit=1000&offset=${off}`,{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY}});
   if(!r.ok)throw 0;
   const part=await r.json();all=all.concat(part);if(part.length<1000)break;off+=1000}
  data=all.map(x=>toP([x.name,x.birthdate,x.telegram])).filter(Boolean);save();render();
  if(!quiet)toast(data.length+' Geburtstage aktualisiert')}
 catch(e){if(!quiet)toast('Aktualisieren nicht möglich, zuletzt geladener Stand wird gezeigt')}}
$('#ref').onclick=()=>loadDB(false);

render();
if(navigator.onLine)loadDB(true);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
