/* Design sofort setzen, noch vor dem ersten Zeichnen (damit der Splash im Darkmode nicht weiß aufblitzt) */
(()=>{try{var d=localStorage.getItem('jk_dark')==='1';document.documentElement.dataset.theme=d?'dark':'light';

</script>
